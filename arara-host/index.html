<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal AraraTech · Hosting</title>
  <style>
    :root { --bg:#0b1220; --card:#162033; --fg:#e8eef8; --muted:#9aadc2; --accent:#0ea5e9; --ok:#22c55e; --err:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:linear-gradient(160deg,#0b1220,#122033 50%,#0b1220); color:var(--fg); min-height:100vh; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .875rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border:1px solid #243247; }
    label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.35rem; }
    input { width:100%; padding:.6rem .75rem; border-radius:8px; border:1px solid #334155; background:#0b1220; color:var(--fg); margin-bottom:.75rem; }
    button { background:var(--accent); color:#041018; border:0; border-radius:8px; padding:.65rem 1rem; font-weight:700; cursor:pointer; width:100%; }
    button:disabled { opacity:.5; }
    .msg { font-size:.85rem; margin-top:.75rem; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    pre { background:#0b1220; padding:1rem; border-radius:8px; overflow:auto; font-size:.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Portal AraraTech</h1>
    <p class="sub">Hosting estático · API <code id="apiUrl"></code> · app <code>portal-araratech</code></p>

    <div class="card" id="loginCard">
      <form id="loginForm">
        <label>E-mail</label>
        <input id="email" type="email" required placeholder="leonardololato@arara-tech.com" />
        <label>Senha</label>
        <input id="password" type="password" required placeholder="AraraUnificado2026!" />
        <button type="submit">Entrar (Arara)</button>
        <p class="msg" id="loginMsg"></p>
      </form>
    </div>

    <div class="card" id="dataCard" hidden>
      <p class="sub" id="who"></p>
      <button type="button" id="meBtn">Ver sessão / memberships</button>
      <p class="msg" id="dataMsg"></p>
      <pre id="out"></pre>
    </div>
  </div>
  <script>
    const ARARA = (localStorage.getItem('arara_api_url') || 'http://localhost:4100').replace(/\/$/, '')
    const SLUG = 'portal-araratech'
    document.getElementById('apiUrl').textContent = ARARA

    const loginForm = document.getElementById('loginForm')
    const loginMsg = document.getElementById('loginMsg')
    const dataCard = document.getElementById('dataCard')
    const loginCard = document.getElementById('loginCard')

    if (localStorage.getItem('arara_jwt') && localStorage.getItem('arara_app_key:' + SLUG)) {
      loginCard.hidden = true
      dataCard.hidden = false
      document.getElementById('who').textContent = 'Logado · key ok'
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      loginMsg.textContent = 'Autenticando…'
      loginMsg.className = 'msg'
      try {
        const res = await fetch(ARARA + '/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || data.message || 'Falha')
        const token = data.token || data.accessToken
        localStorage.setItem('arara_jwt', token)
        const kr = await fetch(ARARA + '/v1/apps/' + SLUG + '/keys', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'portal-hosting' }),
        })
        const kb = await kr.json()
        if (!kr.ok) throw new Error(kb.error || 'Falha ao mint key')
        localStorage.setItem('arara_app_key:' + SLUG, kb.apiKey.key)
        loginMsg.textContent = 'OK · ' + data.user.email
        loginMsg.className = 'msg ok'
        loginCard.hidden = true
        dataCard.hidden = false
        document.getElementById('who').textContent = data.user.email
        document.getElementById('out').textContent = JSON.stringify({ user: data.user }, null, 2)
      } catch (err) {
        loginMsg.textContent = err.message
        loginMsg.className = 'msg err'
      }
    })

    document.getElementById('meBtn').addEventListener('click', async () => {
      const msg = document.getElementById('dataMsg')
      msg.textContent = 'Carregando…'
      try {
        const token = localStorage.getItem('arara_jwt')
        const res = await fetch(ARARA + '/v1/auth/me', {
          headers: { Authorization: 'Bearer ' + token },
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Erro')
        document.getElementById('out').textContent = JSON.stringify(data, null, 2)
        msg.textContent = 'OK'
        msg.className = 'msg ok'
      } catch (err) {
        msg.textContent = err.message
        msg.className = 'msg err'
      }
    })
  </script>
</body>
</html>
